[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mascotinhos"
version = "0.1.0"
description = "Mascotes animados em Python puro: formas e animações em JSON, desenho com Pillow, saída em PNG, GIF e SVG."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Jonas Timbaúba" }, { name = "João Vitor Lima" }, { name = "Gilson Bezerra" }]
requires-python = ">=3.9"
dependencies = ["Pillow>=10.0"]
keywords = ["mascote", "avatar", "animação", "pillow", "svg"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.urls]
Repository = "https://github.com/GilsonB12/mascotinhos"

[project.scripts]
mascotinhos = "mascotinhos.cli:main"

[tool.setuptools]
packages = ["mascotinhos"]

[tool.setuptools.package-data]
mascotinhos = ["animacoes/*.json", "animacoes_*/*.json", "formas_exemplo/*.json"]
