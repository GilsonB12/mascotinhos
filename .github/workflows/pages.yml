# A demonstração do player (js/demo) no GitHub Pages, a cada push na main que mexe em js/.
# Uma vez só, no GitHub: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: demo no GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "js/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  montar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: actions/configure-pages@v5
      - name: monta o site (a demo, o player e os dados, sem passo de build)
        run: node js/scripts/site.mjs _site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  publicar:
    needs: montar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
