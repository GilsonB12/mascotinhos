# Os testes do pacote Python (em Linux, macOS e Windows) e do player em JavaScript, a cada push e pull request.
name: testes

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # o mínimo do pyproject (requires-python >= 3.9): o setup-python só tem o 3.9 para Linux
          - os: ubuntu-latest
            python: "3.9"
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: instala o pacote (e o Pillow, do pyproject)
        run: python -m pip install .
      - name: testes
        run: python -m unittest discover -s tests -v
      - name: o pacote instalado traz os JSON das animações e das formas
        working-directory: ${{ runner.temp }}
        run: python -m mascotinhos listar --pacote terminal

  js:
    name: player JS · Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      # a conferência de js/dados/ pede ao Python a tabela da fonte de pontos do terminal
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Pillow (para o Python exportar a fonte)
        run: python -m pip install "Pillow>=10.0"
      - name: testes (paridade com o Python, SVG, runtime, sincronia)
        run: node --test
      - name: js/dados/ em dia com o pacote Python
        run: node scripts/sincronizar.mjs --conferir
